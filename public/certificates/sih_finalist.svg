<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="sihBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sihGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#sihBg)"/>
  <rect x="25" y="25" width="950" height="650" rx="16" fill="none" stroke="url(#sihGold)" stroke-width="4"/>
  <rect x="40" y="40" width="920" height="620" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6"/>

  <text x="500" y="100" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f59e0b" letter-spacing="3">SMART INDIA HACKATHON 2026</text>
  <text x="500" y="130" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Ministry of Education &amp; Innovation Cell, Govt. of India</text>

  <g transform="translate(500, 230)">
    <circle cx="0" cy="0" r="55" fill="url(#sihGold)"/>
    <path d="M-20,-10 L0,-30 L20,-10 L10,-10 L10,20 L-10,20 L-10,-10 Z" fill="#090d16"/>
    <polygon points="0,-18 5,-5 18,-5 8,3 12,16 0,8 -12,16 -8,3 -18,-5 -5,-5" fill="#ffffff"/>
  </g>

  <text x="500" y="330" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" fill="#cbd5e1">This is to certify that</text>
  <text x="500" y="380" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff">JANARDHAN DEVARALA</text>

  <text x="500" y="430" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">has been recognized as a National Finalist in</text>
  <text x="500" y="475" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#fbbf24">Smart India Hackathon (SIH) 2026</text>

  <rect x="330" y="515" width="340" height="45" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="543" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#f59e0b">Certificate ID: SIH-2026-FINALIST</text>

  <text x="200" y="620" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Organizing Committee</text>
  <text x="800" y="620" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">National Innovation Director</text>
</svg>
